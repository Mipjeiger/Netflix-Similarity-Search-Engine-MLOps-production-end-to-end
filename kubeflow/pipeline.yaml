# PIPELINE DEFINITION
# Name: netflix-content-recommendation-pipeline
# Description: End-to-end ML pipeline for Netflix content recommendations
# Inputs:
#    data_path: str [Default: 'https://github.com/Mipjeiger/Netflix-Similarity-Search-Engine-MLOps-production-end-to-end/blob/main/data/raw/netflix_titles.csv']
#    do_deploy: bool [Default: True]
#    max_df: float [Default: 0.8]
#    min_df: int [Default: 2.0]
#    model_name: str [Default: 'netflix_content_model']
#    n_features: int [Default: 5000.0]
components:
  comp-condition-1:
    dag:
      tasks:
        condition-2:
          componentRef:
            name: comp-condition-2
          inputs:
            artifacts:
              pipelinechannel--train-model-model_output:
                componentInputArtifact: pipelinechannel--train-model-model_output
            parameters:
              pipelinechannel--do_deploy:
                componentInputParameter: pipelinechannel--do_deploy
              pipelinechannel--evaluate-model-status:
                componentInputParameter: pipelinechannel--evaluate-model-status
              pipelinechannel--model_name:
                componentInputParameter: pipelinechannel--model_name
          taskInfo:
            name: deploy_enabled
          triggerPolicy:
            condition: inputs.parameter_values['pipelinechannel--do_deploy'] == true
    inputDefinitions:
      artifacts:
        pipelinechannel--train-model-model_output:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        pipelinechannel--do_deploy:
          parameterType: BOOLEAN
        pipelinechannel--evaluate-model-status:
          parameterType: STRING
        pipelinechannel--model_name:
          parameterType: STRING
  comp-condition-2:
    dag:
      tasks:
        deploy-model:
          cachingOptions:
            enableCache: true
          componentRef:
            name: comp-deploy-model
          inputs:
            artifacts:
              model_input:
                componentInputArtifact: pipelinechannel--train-model-model_output
            parameters:
              model_name:
                componentInputParameter: pipelinechannel--model_name
          taskInfo:
            name: deploy-model
    inputDefinitions:
      artifacts:
        pipelinechannel--train-model-model_output:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        pipelinechannel--do_deploy:
          parameterType: BOOLEAN
        pipelinechannel--evaluate-model-status:
          parameterType: STRING
        pipelinechannel--model_name:
          parameterType: STRING
  comp-deploy-model:
    executorLabel: exec-deploy-model
    inputDefinitions:
      artifacts:
        model_input:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        deploy_target:
          defaultValue: mlflow
          isOptional: true
          parameterType: STRING
        model_name:
          defaultValue: netflix_content_model
          isOptional: true
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-evaluate-model:
    executorLabel: exec-evaluate-model
    inputDefinitions:
      artifacts:
        model_input:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        processed_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        eval_report:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        metrics_output:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
      parameters:
        eval_metrics:
          parameterType: STRING
        status:
          parameterType: STRING
  comp-load-data:
    executorLabel: exec-load-data
    inputDefinitions:
      parameters:
        data_path:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        output_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        columns:
          parameterType: STRING
        dataset_shape:
          parameterType: STRING
  comp-preprocess-data:
    executorLabel: exec-preprocess-data
    inputDefinitions:
      artifacts:
        input_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        output_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        output_features:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
        missing_values:
          parameterType: STRING
        processed_shape:
          parameterType: STRING
  comp-train-model:
    executorLabel: exec-train-model
    inputDefinitions:
      artifacts:
        processed_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        max_df:
          defaultValue: 0.8
          isOptional: true
          parameterType: NUMBER_DOUBLE
        min_df:
          defaultValue: 2.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        n_features:
          defaultValue: 5000.0
          isOptional: true
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      artifacts:
        model_output:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        vectorizer_output:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
        model_info:
          parameterType: STRING
        train_metrics:
          parameterType: STRING
defaultPipelineRoot: minio://mlpipeline/v2/artifacts
deploymentSpec:
  executors:
    exec-deploy-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - deploy_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef deploy_model(\n    model_input: Input[Model],\n    model_name:\
          \ str = \"netflix_content_model\",\n    deploy_target: str = \"mlflow\"\n\
          ) -> str:\n    \"\"\"Deploy model to production\"\"\"\n    import pickle\n\
          \    import mlflow\n    import os\n    import logging\n\n    logging.basicConfig(level=logging.INFO)\n\
          \    logger = logging.getLogger(__name__)\n\n    model_path = model_input.path\n\
          \n    # Load vectorizer\n    with open(f\"{model_path}/tfidf_vectorizer.pkl\"\
          , 'rb') as f:\n        vectorizer = pickle.load(f)\n\n    # Register with\
          \ MLflow\n    mlflow.set_tracking_uri(os.getenv('MLFLOW_TRACKING_URI', 'http://mlflow.kubeflow.svc.cluster.local:5000'))\n\
          \    mlflow.set_experiment(\"kubeflow_netflix\")\n\n    with mlflow.start_run(run_name=\"\
          kubeflow_pipeline\"):\n        mlflow.sklearn.log_model(\n            sk_model=vectorizer,\n\
          \            artifact_path=\"tfidf_model\",\n            registered_model_name=model_name\n\
          \        )\n\n        # Log model info\n        mlflow.log_params({\n  \
          \          'model_type': 'tfidf_cosine',\n            'deployed_by': 'kubeflow'\n\
          \        })\n\n    logger.info(f\"\u2705 Model '{model_name}' deployed successfully!\"\
          )\n    return f\"Model {model_name} deployed to MLflow\"\n\n"
        image: mipjeiger/netflix-kfp-base:v1
    exec-evaluate-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - evaluate_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef evaluate_model(\n    processed_data: Input[Dataset],\n    model_input:\
          \ Input[Model],\n    metrics_output: Output[Metrics],\n    eval_report:\
          \ Output[Artifact]\n) -> NamedTuple('EvaluateOutputs', [('eval_metrics',\
          \ str), ('status', str)]):\n    \"\"\"Evaluate the trained model\"\"\"\n\
          \    import pandas as pd\n    import numpy as np\n    from sklearn.metrics.pairwise\
          \ import cosine_similarity\n    import pickle\n    import json\n    import\
          \ logging\n    from collections import namedtuple\n\n    logging.basicConfig(level=logging.INFO)\n\
          \    logger = logging.getLogger(__name__)\n\n    # Load data\n    df = pd.read_csv(processed_data.path)\n\
          \    logger.info(f\"Loaded {len(df)} samples\")\n\n    # Load vectorizer\n\
          \    model_path = model_input.path\n    with open(f\"{model_path}/tfidf_vectorizer.pkl\"\
          , 'rb') as f:\n        vectorizer = pickle.load(f)\n\n    # Transform data\n\
          \    tfidf_matrix = vectorizer.transform(df['combined_features'])\n\n  \
          \  # Calculate similarity\n    similarity_matrix = cosine_similarity(tfidf_matrix)\n\
          \n    # Evaluate on sample\n    sample_size = min(100, len(df))\n    sample_indices\
          \ = np.random.choice(len(df), sample_size, replace=False)\n\n    precision_scores\
          \ = []\n    recall_scores = []\n\n    for idx in sample_indices:\n     \
          \   sim_scores = similarity_matrix[idx]\n        top_indices = np.argsort(sim_scores)[-6:-1]\
          \  # Top 5 (excluding self)\n\n        # Check if same genre appears in\
          \ recommendations\n        actual_genre = df.iloc[idx]['listed_in']\n  \
          \      recommended_genres = df.iloc[top_indices]['listed_in'].values\n\n\
          \        # Precision: fraction of recommendations with same genre\n    \
          \    precision = sum(1 for g in recommended_genres if g == actual_genre)\
          \ / len(recommended_genres)\n        precision_scores.append(precision)\n\
          \n        # Recall: fraction of relevant content found\n        recall =\
          \ sum(1 for g in recommended_genres if g == actual_genre) / 1  # Only 1\
          \ relevant per query\n        recall_scores.append(recall)\n\n    avg_precision\
          \ = np.mean(precision_scores)\n    avg_recall = np.mean(recall_scores)\n\
          \    f1_score = 2 * (avg_precision * avg_recall) / (avg_precision + avg_recall\
          \ + 1e-8)\n\n    # Prepare evaluation metrics\n    eval_metrics = {\n  \
          \      'precision': float(avg_precision),\n        'recall': float(avg_recall),\n\
          \        'f1_score': float(f1_score),\n        'sample_size': sample_size,\n\
          \        'avg_similarity': float(np.mean(similarity_matrix[similarity_matrix\
          \ < 1]))\n    }\n\n    # Save metrics\n    with open(metrics_output.path,\
          \ 'w') as f:\n        json.dump(eval_metrics, f)\n\n    # Save evaluation\
          \ report\n    report = {\n        'metrics': eval_metrics,\n        'model_type':\
          \ 'tfidf_cosine',\n        'evaluation_timestamp': pd.Timestamp.now().isoformat()\n\
          \    }\n    with open(eval_report.path, 'w') as f:\n        json.dump(report,\
          \ f, indent=2)\n\n    logger.info(f\"Evaluation metrics: {eval_metrics}\"\
          )   \n    status = 'success' if avg_precision > 0.5 else 'needs_improvement'\n\
          \n    EvaluateModelOutputs = namedtuple('EvaluateOutputs', ['eval_metrics',\
          \ 'status'])\n    return EvaluateModelOutputs(\n        json.dumps(eval_metrics),\n\
          \        status\n    )\n\n"
        image: mipjeiger/netflix-kfp-base:v1
    exec-load-data:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - load_data
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef load_data(\n    data_path: str,\n    output_data: Output[Dataset]\n\
          ) -> NamedTuple('LoadDataOutputs', [('dataset_shape', str), ('columns',\
          \ str)]):\n    \"\"\"Load Netflix dataset from source\"\"\"\n    import\
          \ pandas as pd\n    import json\n    import logging\n    import os\n   \
          \ import requests\n    from collections import namedtuple\n\n    logging.basicConfig(level=logging.INFO)\n\
          \    logger = logging.getLogger(__name__)\n\n    logger.info(f\"Loading\
          \ data from: {data_path}\")\n\n    # Handle GitHub blob URLs\n    if \"\
          github.com\" in data_path and \"/blob/\" in data_path:\n        data_path\
          \ = data_path.replace(\"github.com\", \"raw.githubusercontent.com\").replace(\"\
          /blob/\", \"/\")\n        logger.info(f\"Converted to raw URL: {data_path}\"\
          )\n\n    try:\n        # Load data from Minio/S3\n        if data_path.startswith(\"\
          s3://\") or data_path.startswith(\"minio://\"):\n            s3_path = data_path.replace(\"\
          minio://\", \"s3://\")\n            storage_options = {\n              \
          \  \"key\": os.getenv(\"AWS_ACCESS_KEY_ID\"),\n                \"secret\"\
          : os.getenv(\"AWS_SECRET_ACCESS_KEY\"),\n                \"client_kwargs\"\
          : {\n                    \"endpoint_url\": os.getenv(\"MINIO_ENDPOINT\"\
          , \"http://minio:9000\")\n                }\n            }\n           \
          \ df = pd.read_csv(s3_path, storage_options=storage_options)\n\n       \
          \ # Handle HTTP/HTTPS URLs\n        elif data_path.startswith(\"http://\"\
          ) or data_path.startswith(\"https://\"):\n            # Try to read directly\
          \ first\n            try:\n                df = pd.read_csv(data_path)\n\
          \            except Exception as e:\n                logger.warning(f\"\
          Direct read failed: {e}. Trying with requests...\")\n                response\
          \ = requests.get(data_path)\n                response.raise_for_status()\n\
          \n                # Use StringIO to read CSV from response text\n      \
          \          from io import StringIO\n                df = pd.read_csv(StringIO(response.text))\n\
          \n        # Local file\n        else:\n            df = pd.read_csv(data_path)\n\
          \n    except Exception as e:\n        logger.error(f\"Failed to load data:\
          \ {e}\")\n        # Try alternative method - download via requests\n   \
          \     if data_path.startswith(\"http\"):\n            logger.info(\"Attempting\
          \ to download via requests...\")\n            import requests\n        \
          \    from io import StringIO\n            response = requests.get(data_path)\n\
          \            response.raise_for_status()\n            df = pd.read_csv(StringIO(response.text))\n\
          \        else:\n            raise\n\n    # Save to KFP output artifact path\n\
          \    df.to_csv(output_data.path, index=False)\n\n    # Return metadata\n\
          \    shape = df.shape\n    columns = df.columns.tolist()\n\n    logger.info(f\"\
          Data loaded successfully! Shape: {shape}\")\n\n    LoadDataOutputs = namedtuple('LoadDataOutputs',\
          \ ['dataset_shape', 'columns'])\n    return LoadDataOutputs(\n        dataset_shape=json.dumps({\"\
          rows\": shape[0], \"cols\": shape[1]}),\n        columns=json.dumps(columns)\n\
          \    )\n\n"
        image: mipjeiger/netflix-kfp-base:v1
    exec-preprocess-data:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - preprocess_data
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef preprocess_data(\n    input_data: Input[Dataset],\n    output_data:\
          \ Output[Dataset],\n    output_features: Output[Artifact]\n) -> NamedTuple('PreprocessOutputs',\
          \ [('processed_shape', str), ('missing_values', str)]):\n    \"\"\"Preprocess\
          \ Netflix data\"\"\"\n    import pandas as pd\n    import numpy as np\n\
          \    import json\n    import logging\n    from collections import namedtuple\n\
          \n    logging.basicConfig(level=logging.INFO)\n    logger = logging.getLogger(__name__)\n\
          \n    # Load data\n    df = pd.read_csv(input_data.path)\n    logger.info(f\"\
          Loaded data with shape: {df.shape}\")\n\n    # Handle missing values\n \
          \   df['director'] = df['director'].fillna('Unknown')\n    df['cast'] =\
          \ df['cast'].fillna('Unknown')\n    df['country'] = df['country'].fillna('Unknown')\n\
          \    df['date_added'] = df['date_added'].fillna(method='ffill')\n    df['rating']\
          \ = df['rating'].fillna(df['rating'].mode()[0])\n    df['duration'] = df['duration'].fillna(df['duration'].mode()[0])\n\
          \n    # Convert date\n    df['date_added'] = df['date_added'].fillna(method='ffill')\n\
          \    df['date_added'] = df['date_added'].astype(str).str.strip()\n    df['date_added']\
          \ = pd.to_datetime(df['date_added'], format='mixed', errors='coerce')\n\n\
          \    df['year_added'] = df['date_added'].dt.year\n    df['month_added']\
          \ = df['date_added'].dt.month\n\n    # Create combined features for similarity\n\
          \    text_cols = ['director', 'cast', 'listed_in', 'description']\n    for\
          \ col in text_cols:\n        if col in df.columns:\n            df[col]\
          \ = df[col].fillna('Unknown')\n            df[col] = df[col].astype(str).str.strip()\n\
          \n    df['combined_features'] = df.apply(\n        lambda r: \" \".join(\n\
          \            [str(r[c]) for c in text_cols if c in r and str(r[c]).strip()\
          \ != \"Unknown\" \\\n             and str(r[c]).strip() != \"nan\" and str(r[c]).strip()\
          \ != \"None\"]\n        ), axis=1\n    )\n\n    # Save processed data\n\
          \    df.to_csv(output_data.path, index=False)\n\n    # Save feature info\n\
          \    feature_info = {\n        'features': df['combined_features'].tolist()[:5],\n\
          \        'feature_names': df.columns.tolist(),\n        'n_samples': len(df)\n\
          \    }\n    with open(output_features.path, 'w') as f:\n        json.dump(feature_info,\
          \ f)\n\n    # Missing values summary\n    missing = df.isnull().sum().to_dict()\n\
          \n    logger.info(f\"Preprocessed data shape: {df.shape}\")\n    logger.info(f\"\
          Missing values: {missing}\")\n\n    PreprocessOutputs = namedtuple('PreprocessOutputs',\
          \ ['processed_shape', 'missing_values'])\n    return PreprocessOutputs(\n\
          \        processed_shape=json.dumps({\"rows\": df.shape[0], \"cols\": df.shape[1]}),\n\
          \        missing_values=json.dumps(missing)\n    )\n\n"
        image: mipjeiger/netflix-kfp-base:v1
    exec-train-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - train_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef train_model(\n    processed_data: Input[Dataset],\n    model_output:\
          \ Output[Model],\n    vectorizer_output: Output[Artifact],\n    n_features:\
          \ int = 5000,\n    min_df: int = 2,\n    max_df: float = 0.8\n) -> NamedTuple('TrainModelOutputs',\
          \ [('model_info', str), ('train_metrics', str)]):\n    \"\"\"Train TF-IDF\
          \ recommendation model\"\"\"\n    import os\n    import pandas as pd\n \
          \   import numpy as np\n    from sklearn.feature_extraction.text import\
          \ TfidfVectorizer\n    from sklearn.metrics.pairwise import cosine_similarity\n\
          \    import pickle\n    import json\n    import mlflow\n    import logging\n\
          \    from collections import namedtuple\n\n    logging.basicConfig(level=logging.INFO)\n\
          \    logger = logging.getLogger(__name__)\n\n    # Load processed data\n\
          \    df = pd.read_csv(processed_data.path)\n    logger.info(f\"Loaded {len(df)}\
          \ samples\")\n\n    # Initialize TF-IDF vectorizer\n    vectorizer = TfidfVectorizer(\n\
          \        max_features=n_features,\n        min_df=min_df,\n        max_df=max_df,\n\
          \        ngram_range=(1, 2),\n        stop_words='english'\n    )\n\n  \
          \  # Fit and transform\n    tfidf_matrix = vectorizer.fit_transform(df['combined_features'])\n\
          \    similarity_matrix = cosine_similarity(tfidf_matrix)\n\n    # Save model\
          \ artifacts\n    os.makedirs(model_output.path, exist_ok=True)\n    with\
          \ open(f\"{model_output.path}/tfidf_vectorizer.pkl\", 'wb') as f:\n    \
          \    pickle.dump(vectorizer, f)\n\n    # Save similarity matrix (if not\
          \ too large)\n    if similarity_matrix.shape[0] <= 10000:\n        np.save(f\"\
          {model_output.path}/similarity_matrix.npy\", similarity_matrix)\n\n    #\
          \ Save processed data for recommendations\n    df.to_csv(f\"{model_output.path}/processed_data.csv\"\
          , index=False)\n\n    # Save vectorizer info\n    vectorizer_info = {\n\
          \        'n_features': n_features,\n        'min_df': min_df,\n        'max_df':\
          \ max_df,\n        'vocabulary_size': len(vectorizer.vocabulary_),\n   \
          \     'matrix_shape': tfidf_matrix.shape\n    }\n    with open(vectorizer_output.path,\
          \ 'w') as f:\n        json.dump(vectorizer_info, f)\n\n    # Calculate metrics\n\
          \    sparsity = 1 - (similarity_matrix > 0).sum().sum() / (similarity_matrix.shape[0]\
          \ ** 2)\n    avg_similarity = similarity_matrix[similarity_matrix < 1].mean()\n\
          \n    metrics = {\n        'n_features': n_features,\n        'vocabulary_size':\
          \ len(vectorizer.vocabulary_),\n        'sparsity': float(sparsity),\n \
          \       'avg_similarity': float(avg_similarity),\n        'n_samples': len(df),\n\
          \        'n_components': tfidf_matrix.shape[1]\n    }\n\n    logger.info(f\"\
          Training metrics: {metrics}\")\n\n    TrainModelOutputs = namedtuple('TrainModelOutputs',\
          \ ['model_info', 'train_metrics'])\n    return TrainModelOutputs(\n    \
          \    json.dumps({'model_type': 'tfidf_cosine', 'status': 'success'}),\n\
          \        json.dumps(metrics)\n    )\n\n"
        image: mipjeiger/netflix-kfp-base:v1
pipelineInfo:
  description: End-to-end ML pipeline for Netflix content recommendations
  name: netflix-content-recommendation-pipeline
root:
  dag:
    tasks:
      condition-1:
        componentRef:
          name: comp-condition-1
        dependentTasks:
        - evaluate-model
        - train-model
        inputs:
          artifacts:
            pipelinechannel--train-model-model_output:
              taskOutputArtifact:
                outputArtifactKey: model_output
                producerTask: train-model
          parameters:
            pipelinechannel--do_deploy:
              componentInputParameter: do_deploy
            pipelinechannel--evaluate-model-status:
              taskOutputParameter:
                outputParameterKey: status
                producerTask: evaluate-model
            pipelinechannel--model_name:
              componentInputParameter: model_name
        taskInfo:
          name: deploy_condition
        triggerPolicy:
          condition: inputs.parameter_values['pipelinechannel--evaluate-model-status']
            == 'success'
      evaluate-model:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-evaluate-model
        dependentTasks:
        - preprocess-data
        - train-model
        inputs:
          artifacts:
            model_input:
              taskOutputArtifact:
                outputArtifactKey: model_output
                producerTask: train-model
            processed_data:
              taskOutputArtifact:
                outputArtifactKey: output_data
                producerTask: preprocess-data
        taskInfo:
          name: evaluate-model
      load-data:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-load-data
        inputs:
          parameters:
            data_path:
              componentInputParameter: data_path
        taskInfo:
          name: load-data
      preprocess-data:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-preprocess-data
        dependentTasks:
        - load-data
        inputs:
          artifacts:
            input_data:
              taskOutputArtifact:
                outputArtifactKey: output_data
                producerTask: load-data
        taskInfo:
          name: preprocess-data
      train-model:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train-model
        dependentTasks:
        - preprocess-data
        inputs:
          artifacts:
            processed_data:
              taskOutputArtifact:
                outputArtifactKey: output_data
                producerTask: preprocess-data
          parameters:
            max_df:
              componentInputParameter: max_df
            min_df:
              componentInputParameter: min_df
            n_features:
              componentInputParameter: n_features
        taskInfo:
          name: train-model
  inputDefinitions:
    parameters:
      data_path:
        defaultValue: https://github.com/Mipjeiger/Netflix-Similarity-Search-Engine-MLOps-production-end-to-end/blob/main/data/raw/netflix_titles.csv
        isOptional: true
        parameterType: STRING
      do_deploy:
        defaultValue: true
        isOptional: true
        parameterType: BOOLEAN
      max_df:
        defaultValue: 0.8
        isOptional: true
        parameterType: NUMBER_DOUBLE
      min_df:
        defaultValue: 2.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      model_name:
        defaultValue: netflix_content_model
        isOptional: true
        parameterType: STRING
      n_features:
        defaultValue: 5000.0
        isOptional: true
        parameterType: NUMBER_INTEGER
schemaVersion: 2.1.0
sdkVersion: kfp-2.17.0
