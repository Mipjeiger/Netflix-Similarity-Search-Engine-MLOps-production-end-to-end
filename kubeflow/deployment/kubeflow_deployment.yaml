apiVersion: v1
kind: Namespace
metadata:
  name: kubeflow
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: netflix-pipeline-runner
  namespace: kubeflow
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: netflix-pipeline-runner-role
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "services", "configmaps", "persistentvolumeclaims"]
  verbs: ["*"]
- apiGroups: ["argoproj.io"]
  resources: ["workflows", "workflows/finalizers"]
  verbs: ["*"]
- apiGroups: ["kubeflow.org"]
  resources: ["*"]
  verbs: ["*"]
- apiGroups: ["storage.k8s.io"]
  resources: ["storageclasses"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: netflix-pipeline-runner-binding
subjects:
- kind: ServiceAccount
  name: netflix-pipeline-runner
  namespace: kubeflow
roleRef:
  kind: ClusterRole
  name: netflix-pipeline-runner-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: netflix-data-pvc
  namespace: kubeflow
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: netflix-pipeline-config
  namespace: kubeflow
data:
  config.yaml: |
    data:
      raw_path: "/data/netflix_titles.csv"
      processed_path: "/data/processed"
    models:
      n_features: 5000
      n_recommendations: 5
    mlflow:
      tracking_uri: "http://mlflow-service:5000"
      experiment_name: "netflix_content"
      model_name: "netflix_content_model"
    training:
      test_size: 0.2
      random_state: 42
      validation_threshold: 0.6
---
apiVersion: v1
kind: Secret
metadata:
  name: gcp-credentials
  namespace: kubeflow
type: Opaque
data:
  # Base64 encoded credentials (optional)
  # credentials.json: <base64-encoded-json>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix-pipeline-scheduler
  namespace: kubeflow
  labels:
    app: netflix-pipeline
    component: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netflix-pipeline
      component: scheduler
  template:
    metadata:
      labels:
        app: netflix-pipeline
        component: scheduler
    spec:
      serviceAccountName: netflix-pipeline-runner
      containers:
      - name: scheduler
        image: your-registry/netflix-kubeflow:latest
        imagePullPolicy: Always
        command:
        - "python"
        - "-c"
        - |
          import time
          import kfp
          import os
          from kfp import dsl, compiler
          import yaml
          
          # Load config
          with open('/app/config/config.yaml', 'r') as f:
              config = yaml.safe_load(f)
          
          # Wait for Kubeflow to be ready
          time.sleep(30)
          
          # Submit pipeline on schedule
          client = kfp.Client()
          
          # Check if pipeline exists
          try:
              pipeline = client.get_pipeline('netflix-content-pipeline')
              print(f"✅ Pipeline found: {pipeline.id}")
          except:
              print("⏳ Pipeline not found, uploading...")
              pipeline = client.upload_pipeline(
                  pipeline_package_path='/app/pipelines/pipeline.yaml',
                  pipeline_name='Netflix Content Recommendation Pipeline',
                  description='End-to-end ML pipeline for Netflix content'
              )
              print(f"✅ Pipeline uploaded: {pipeline.id}")
          
          # Create experiment if not exists
          try:
              experiment = client.get_experiment('netflix-experiment')
              print(f"✅ Experiment found: {experiment.id}")
          except:
              experiment = client.create_experiment('netflix-experiment')
              print(f"✅ Experiment created: {experiment.id}")
          
          # Schedule recurring runs
          from kfp import dsl
          
          @dsl.pipeline(
              name="Scheduled Netflix Pipeline",
              description="Weekly scheduled run"
          )
          def scheduled_pipeline():
              # Your pipeline definition
              pass
          
          # Keep running
          print("🔄 Scheduler running. Press Ctrl+C to stop.")
          while True:
              time.sleep(3600)  # Check every hour
        env:
        - name: MLFLOW_TRACKING_URI
          value: "http://mlflow-service:5000"
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: "/etc/gcp/credentials.json"
        - name: DATA_PATH
          value: "/data/netflix_titles.csv"
        volumeMounts:
        - name: gcp-creds
          mountPath: /etc/gcp
          readOnly: true
        - name: data-volume
          mountPath: /data
        - name: config-volume
          mountPath: /app/config
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1"
        livenessProbe:
          exec:
            command:
            - "python"
            - "-c"
            - "import kfp; kfp.Client().get_kfp_healthz()"
          initialDelaySeconds: 60
          periodSeconds: 300
      volumes:
      - name: gcp-creds
        secret:
          secretName: gcp-credentials
          optional: true
      - name: data-volume
        persistentVolumeClaim:
          claimName: netflix-data-pvc
      - name: config-volume
        configMap:
          name: netflix-pipeline-config
---
apiVersion: v1
kind: Service
metadata:
  name: netflix-pipeline-service
  namespace: kubeflow
  labels:
    app: netflix-pipeline
spec:
  selector:
    app: netflix-pipeline
    component: scheduler
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: netflix-pipeline-ingress
  namespace: kubeflow
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: netflix-pipeline.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: netflix-pipeline-service
            port:
              number: 8080
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: netflix-pipeline-cron
  namespace: kubeflow
spec:
  schedule: "0 0 * * 0"  # Weekly on Sunday at midnight
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: netflix-pipeline-runner
          containers:
          - name: pipeline-runner
            image: your-registry/netflix-kubeflow:latest
            imagePullPolicy: Always
            command:
            - "python"
            - "-c"
            - |
              import kfp
              import yaml
              
              # Load pipeline params
              with open('/app/config/pipeline_params.yaml', 'r') as f:
                  params = yaml.safe_load(f)
              
              # Submit run
              client = kfp.Client()
              run = client.create_run_from_pipeline_package(
                  pipeline_file='/app/pipelines/pipeline.yaml',
                  arguments=params['params'],
                  experiment_name='netflix-experiment',
                  run_name=f"netflix-scheduled-$(date +%Y%m%d)"
              )
              print(f"✅ Scheduled run started: {run.run_id}")
            env:
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow-service:5000"
            volumeMounts:
            - name: data-volume
              mountPath: /data
            - name: config-volume
              mountPath: /app/config
            resources:
              requests:
                memory: "1Gi"
                cpu: "500m"
              limits:
                memory: "4Gi"
                cpu: "2"
          volumes:
          - name: data-volume
            persistentVolumeClaim:
              claimName: netflix-data-pvc
          - name: config-volume
            configMap:
              name: netflix-pipeline-config
          restartPolicy: OnFailure